[package]
name = "connector-supabase"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
connector-sdk = { version = "0.1.0", path = "../connector-sdk" }
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_bw = "2.5.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-postgres = "0.7.18"
zeroize = "1.9.0"

[dev-dependencies]
testcontainers = "0.27.3"
