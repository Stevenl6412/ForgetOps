[package]
name = "agent-store"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "=0.11.0", features = ["zeroize"] }
agent-core = { version = "=0.1.0", path = "../agent-core" }
async-trait = "0.1.91"
base64 = "=0.23.0"
hkdf = "=0.13.0"
rand = "0.10.2"
rand_core = "0.10.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.11.0"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
