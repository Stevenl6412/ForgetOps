[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-protocol = { version = "=0.1.0", path = "../agent-protocol" }
async-trait = "=0.1.91"
base64 = "=0.23.0"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }
hmac = "=0.13.0"
rand = "=0.10.2"
rand_core = "=0.10.1"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.11.0"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
