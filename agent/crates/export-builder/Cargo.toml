[package]
name = "export-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "=0.23.0"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
hkdf = "=0.13.0"
rand = "=0.10.2"
rand_core = "=0.10.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
hex = "=0.4.3"
