packages:
  - apps/*
  - packages/*
  - sdk/*
allowBuilds:
  cpu-features: false
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.6"
  - "@turbo/darwin-arm64@2.10.6"
  - "@turbo/linux-64@2.10.6"
  - "@turbo/linux-arm64@2.10.6"
  - "@turbo/windows-64@2.10.6"
  - "@turbo/windows-arm64@2.10.6"
  - turbo@2.10.6
