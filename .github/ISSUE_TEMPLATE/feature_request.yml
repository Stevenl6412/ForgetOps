name: Feature request
description: Propose a focused improvement to ForgetOps.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Explain the user or operator problem this feature would solve.
    validations:
      required: true
  - type: input
    id: component-version
    attributes:
      label: Affected component and version
      description: Name the related app, package, agent crate, or connector and its version or commit.
      placeholder: "agent/connector-supabase at abc1234"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmations
      options:
        - label: I confirm this request contains no secrets or personal data.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
