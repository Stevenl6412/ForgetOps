name: Bug report
description: Report a reproducible problem in ForgetOps.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction
      description: Describe what happened and the smallest steps to reproduce it.
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: component-version
    attributes:
      label: Affected component and version
      description: Name the app, package, agent crate, or connector and its version or commit.
      placeholder: "apps/api at abc1234"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmations
      options:
        - label: I confirm this report contains no secrets or personal data.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
